name: Ingest data

on:
  schedule:
    # Nightly full refresh at 04:17 Pacific (11:17 UTC during PST, 12:17 UTC during PDT; both are quiet hours).
    - cron: "17 11 * * *"
    # Score refresh every 15 minutes through the AHL's game window, from weekend afternoons to late Pacific games (19:00-07:59 UTC).
    - cron: "*/15 19-23 * * *"
    - cron: "*/15 0-7 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Ingest job (teams|schedule|scores|standings|boxscores|roster|transactions|stats|odds|today|nightly|backfill)"
        default: "nightly"
      args:
        description: "Extra CLI flags, e.g. --game 1029239"
        default: ""

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Pick job
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ github.event.inputs.job }}" >> "$GITHUB_OUTPUT"
            echo "args=${{ github.event.inputs.args }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 11 * * *" ]; then
            echo "job=nightly" >> "$GITHUB_OUTPUT"
          else
            echo "job=today" >> "$GITHUB_OUTPUT"
          fi
      - name: Run ingest
        run: pnpm ingest ${{ steps.pick.outputs.job }} ${{ steps.pick.outputs.args }}
